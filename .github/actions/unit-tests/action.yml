name: Unit tests
description: >-
  Set up Python and run the slopsoil unit test suite. Thin GitHub wrapper around
  the provider-agnostic ci/test/run.sh so the same invocation works locally and
  in CI.

inputs:
  python-version:
    description: Python version to set up.
    required: false
    default: "3.12"
  pytest-args:
    description: Extra arguments forwarded to pytest.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Run unit tests
      shell: bash
      env:
        PYTEST_ARGS: ${{ inputs.pytest-args }}
      run: "${GITHUB_WORKSPACE}/ci/test/run.sh"
