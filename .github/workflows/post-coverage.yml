name: Post coverage comment

# Runs after the read-only "Tests" workflow finishes. This workflow checks out
# NO pull-request code — it only downloads the coverage artifact that Tests
# produced and posts/updates the PR comment — so it is safe to grant the write
# token that Tests deliberately lacks. (workflow_run always runs the copy of
# this file from the default branch, never a PR's version.)
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  post:
    runs-on: ubuntu-latest
    # Only for successful PR runs; ignores non-PR triggers and failed test runs.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    permissions:
      pull-requests: write   # post/update the PR comment
      actions: read          # download the artifact from the triggering run
      contents: read

    steps:
      - name: Check out repository scripts
        uses: actions/checkout@v6

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/test/post-coverage-comment.sh coverage-report
